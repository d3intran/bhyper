[package]
name = "bhyper"
version = "0.1.0"
edition = "2021"
authors = ["d3intran <d3intran@gmail.com>"]
description = "⚡ Ultra Low-Latency Binance x Hyperliquid Cross-Exchange Funding Rate & Basis Arbitrage Engine"
repository = "https://github.com/d3intran/bhyper"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["crypto", "arbitrage", "binance", "hyperliquid", "low-latency"]
categories = ["finance", "network-programming", "command-line-utilities"]

[lib]
name = "bhyper"
path = "src/lib.rs"

[[bin]]
name = "bhyper"
path = "src/main.rs"

[dependencies]
# Async Runtime & Networking
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }

# Logging & Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI Parsing & Error Handling
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
dirs = "5.0"

# Cryptographic Signatures (Zero-Copy & Hardware Accelerated)
ring = "0.17"
hex = "0.4"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
rmp-serde = "1.3"
alloy-primitives = { version = "0.8", features = ["serde"] }
k256 = { version = "0.13", features = ["ecdsa"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
